<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统运维后台登录 - 解忧杂货铺</title>
    <!-- 引入本地库 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .admin-login-card {
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            max-width: 420px;
            width: 100%;
            padding: 30px;
        }
        .form-control {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid #475569;
            color: #f8fafc;
        }
        .form-control:focus {
            background-color: rgba(15, 23, 42, 0.8);
            border-color: #38bdf8;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
            color: #f8fafc;
        }
        .btn-admin {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            transition: all 0.2s;
        }
        .btn-admin:hover {
            background-color: #0369a1;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="admin-login-card">
    <div class="text-center mb-4">
        <span class="badge bg-info bg-opacity-10 text-info px-3 py-2 border border-info border-opacity-20 mb-2" style="font-size: 0.75rem;">
            SYSTEM ADMINISTRATION
        </span>
        <h4 class="fw-bold text-white mt-1">解忧杂货铺 · 运维后台</h4>
        <p class="text-secondary small mb-0">授权系统管理员安全凭证登录接口</p>
    </div>
    
    <!-- 提示消息 -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} bg-opacity-10 text-{{ category }} border border-{{ category }} border-opacity-25 py-2 small mb-3" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <form action="{{ url_for('admin_login') }}" method="POST">
        <div class="mb-3">
            <label for="username" class="form-label small fw-semibold text-secondary">管理员账号</label>
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-transparent border-end-0 border-secondary border-opacity-25 text-secondary"><i class="bi bi-shield-lock"></i></span>
                <input type="text" class="form-control border-start-0 border-secondary border-opacity-25" id="username" name="username" placeholder="请输入管理员名" required>
            </div>
        </div>
        
        <div class="mb-4">
            <label for="password" class="form-label small fw-semibold text-secondary">安全密码凭证</label>
            <div class="input-group input-group-sm">
                <span class="input-group-text bg-transparent border-end-0 border-secondary border-opacity-25 text-secondary"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control border-start-0 border-secondary border-opacity-25" id="password" name="password" placeholder="请输入校验密码" required>
            </div>
        </div>
        
        <button type="submit" class="btn btn-admin btn-sm w-100 py-2 fw-semibold mb-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> 安全登录系统
        </button>
        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="text-decoration-none small text-info"><i class="bi bi-arrow-left"></i> 返回学生前台登录</a>
        </div>
    </form>
</div>

</body>
</html>
